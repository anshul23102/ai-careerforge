services:
  - type: web
    name: ai-careerforge-backend
    runtime: docker
    # Build context is the monorepo root (not rootDir: backend) — the backend
    # depends on packages/parsers and packages/shared via npm workspaces, and
    # Docker can't COPY files from outside its build context.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PORT
        value: 3001
